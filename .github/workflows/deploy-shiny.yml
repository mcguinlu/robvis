on:
  push:
    branches:
      - master
      - main
    paths:
      - 'robvisapp/**'

name: Deploy Shiny App to shinyapps.io

jobs:
  deploy:
    name: Deploy to shinyapps.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev

      - name: Install R dependencies
        run: |
          install.packages(c(
            "remotes",
            "rsconnect",
            "shiny",
            "shinyjs",
            "svglite",
            "shinycssloaders",
            "DT",
            "rio",
            "shinyalert",
            "magrittr",
            "waiter",
            "markdown"
          ))
          remotes::install_local(".", quiet = TRUE)
        shell: Rscript {0}

      - name: Authorise and deploy app
        env:
          SHINYAPPS_ACCOUNT: ${{ secrets.SHINYAPPS_ACCOUNT }}
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
        run: |
          rsconnect::setAccountInfo(
            name   = Sys.getenv("SHINYAPPS_ACCOUNT"),
            token  = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(
            appDir    = "robvisapp",
            appName   = "robvis",
            forceUpdate = TRUE
          )
        shell: Rscript {0}
